# Builds standalone git-mirror binaries for every platform, smoke-tests each one on its own OS/CPU,
# and attaches them to the GitHub release together with SHA256SUMS, install.sh and uninstall.sh.
#
# Release assets (what install.sh downloads):
#   git-mirror-{linux-x64,linux-arm64,linux-x64-musl,linux-arm64-musl,darwin-x64,darwin-arm64}.gz
#   SHA256SUMS, install.sh, uninstall.sh

name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (leave empty to only build and test)"
        required: false
        default: ""

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: linux-x64-musl, runner: ubuntu-latest, alpine: true }
          - { platform: linux-arm64-musl, runner: ubuntu-24.04-arm, alpine: true }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check the tag matches package.json
        if: env.RELEASE_TAG != ''
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - name: Build binary
        run: npx tsx scripts/build-binaries.ts ${{ matrix.platform }} --gzip

      - name: Smoke test (native)
        if: ${{ !matrix.alpine }}
        run: sh scripts/smoke-test.sh dist/bin/git-mirror-${{ matrix.platform }}

      - name: Smoke test (Alpine, musl)
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -c \
            "apk add --no-cache git libstdc++ libgcc >/dev/null && sh scripts/smoke-test.sh dist/bin/git-mirror-${{ matrix.platform }}"

      - name: Verify macOS code signature
        if: startsWith(matrix.platform, 'darwin-')
        run: codesign --verify --verbose dist/bin/git-mirror-${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: dist/bin/git-mirror-${{ matrix.platform }}.gz
          if-no-files-found: error

  publish:
    name: attach to release
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: release

      - name: Add installer and checksums
        run: |
          cp install.sh uninstall.sh release/
          cd release
          sha256sum git-mirror-*.gz install.sh uninstall.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
