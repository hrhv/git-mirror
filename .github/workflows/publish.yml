# Publishes the package to GitHub Packages when a release is created.
# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: "@hrhv"
      - run: npm ci
      # prepublishOnly runs typecheck, tests and the build. Pre-releases go to the "next" dist-tag so
      # `npm install @hrhv/git-mirror` keeps resolving to the latest stable version.
      - run: npm publish --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
